    const src = err.path[0].src;
    const href = err.path[0].href;
    var message = ["could not load", src ? src : href].join(" ");
    try {
        const log = messagingClient.create('log', { logLevel: 'error', message: message, applicationName: 'cronos', loggerName: 'Fe.Cronos.Logger' });
        messagingClient.send(log);
    }
    catch (exception) {
    }
}

đầu",bestPriceGuaranteeDetailWithDefault:'<!-- wrapper starts --> <div class="ajax-wrapper"> <h3>Đảm Bảo Giá Tốt Nhất<\/h3> <p>Agoda thực hiện chính sách “Đảm Bảo Giá Tốt Nhất” sau đây. Nếu bạn đã đặt một phòng khách sạn thông qua Agoda và sau đó, cho chúng tôi thấy rằng bạn có thể đặt một phòng tương tự trong cùng khoảng thời gian ở mức giá thấp hơn có thể xem và đặt được trên một website khác, chúng tôi sẽ giảm giá bằng hoặc thấp hơn mức giá đó.<\/p> <h5>Gửi Khiếu Nại<\/h5> <p> Xin vui lòng thu thập thông tin trước khi hoàn thành <a href="http://www.agoda.com/vi-vn/info/contact.html#htldet10" target="_blank"> Phiếu khiếu nại Đảm bảo Giá Tốt Nhất <\/a><\/p> <ul> <li>Mã Đặt phòng Agoda của bạn.<\/li> <li>Địa chỉ trang web bạn tìm thấy giá tốt hơn.<\/li> <li>Tên khách sạn, thành phố, quốc gia.<\/li> <li>Bạn có thể đính kèm tới 3 ảnh chụp màn hình của trang web đối thủ hiển thị rõ thông tin Phòng còn trống, Loại phòng, Loại Khuyến mãi và Giá phòng cho ngày yêu cầu đặt phòng.<\/li> <\/ul> <p>XIN LƯU Ý RẰNG: Bạn không cần đặt phòng trên trang web đối thủ, chỉ cần gửi chúng tôi sự so sánh của bạn<\/p> <h5>Điểu Khoản và Điều Kiện<\/h5> <p><strong>1.<\/strong> Chính sách “Đảm Bảo Giá Tốt Nhất” của chúng tôi chỉ áp dụng cho các đặt phòng đã được xác nhận. Bạn phải cung cấp cho chúng tôi Mã Đặt Phòng Agoda của bạn để đưa ra khiếu nại.<\/p> <p><strong>2.<\/strong> Những điều kiện sau phải được áp dụng:<\/p> <ul class="dash-list"> <li>Cùng khách sạn<\/li> <li>Cùng thời gian nghỉ lại<\/li> <li>Cùng loại Phòng/Giường<\/li> <li>Cùng các yêu cầu mua Trước, yêu cầu trả trước và đặt cọc (nếu có)<\/li> <li>Cùng chính sách Hủy và Sửa Đổi<\/li> <li>Phòng đó phải còn trống để được xác nhận ngay tại thời điểm các đại lý của chúng tôi kiểm tra phòng trống<\/li> <\/ul> <p><strong>3.<\/strong> Chính sách “Đảm Bảo Giá Tốt Nhất” <u>không<\/u> áp dụng cho các mức giá không công bố, như:<\/p> <ul> <li>Mức giá riêng<\/li> <li>Mức giá trọn gói hoặc khuyến mãi<\/li> <li>Các phòng khách sạn đã báo giá như một phần của du lịch trọn gói<\/li> <li>Các mức giá không được áp dụng ra bên ngoài, bao gồm: <br /><br /> <ol class="dash-list"> <li>Các mức giá giảm cho công ty<\/li> <li>Mức giá nhóm hoặc mức giá hội nghị<\/li> <li>Bất kỳ mức giá nào yêu cầu tư cách thành viên, (tức là mức giá AAA hoặc AARP)<\/li> <li>Chương trình khách hàng thân thiết<\/li> <li>Bất kỳ tổ chức nào với các mức giá dành cho nhóm cá nhân cụ thể và không nhằm mục đích áp dụng ra bên ngoài<\/li> <\/ol> <\/li> <\/ul> <p><strong>4.<\/strong> Agoda có toàn quyền xác định tính hợp lệ của bất kỳ khiếu nại nào, bao gồm nhưng không giới hạn ở việc xác định rằng khiếu nại đó có cùng khách sạn, loại phòng, ngày hay không và rằng nó có đáp ứng tất cả những Điều Khoản, Điều Kiện và các yêu cầu về xử lý Khiếu Nại hay không.<\/p> <p><strong>5.<\/strong> Chính sách “Đảm Bảo Giá Tốt Nhất” của chúng tôi không thể kết hợp với các ưu đãi hoặc chương trình khuyến mãi khác.<\/p> <p><strong>6.<\/strong> Agoda có quyền sửa đổi, thay đổi, bổ sung, đình chỉ hoặc chấm dứt chính sách “Đảm Báo Giá Tốt Nhất” vào bất kỳ lúc nào.<\/p> <p>Mọi thắc mắc về khiếu nại xin được gửi trực tiếp đến nhóm Dịch Vụ Khách Hàng của chúng tôi.<\/p> <\/div> <!-- wrapper ends -->',bestPriceGuaranteeWithDefault:"Agoda đảm bảo giá phòng",agodaPriceGuarantee:"Chúng tôi khớp giá!",agodaPriceGuaranteeModalLabel:"Chúng tôi khớp giá",priceAfterCashBackMessage:"Theo Điều khoản Thưởng hoàn tiền mặt",totalPricePerNight:"Mỗi đêm, đã gồm thuế và phí",nonAgodaPricePopup:"Agoda luôn tìm kiếm các ưu đãi tốt nhất từ nhiều nguồn khác nhau để khách hàng nhận được giá tốt nhất! Hơn hết, khách hàng có thể đặt phòng với bất kỳ ưu đãi thông qua Agoda và được đảm bảo giao dịch an toàn, hỗ trợ khách hàng 24/7 và quản lý đặt phòng trực tuyến.",milesText:"Dặm",from:"từ",orPriceText:"or {0} {1}",cashPaidAtProperty:"Giá đơn đặt phòng bao gồm phí khu nghỉ dưỡng phải được thanh toán bằng tiền mặt khi nhận phòng\t",discountPercentOff:"-{0}%",priceBeforeCashBackTooltip:"Đ ;ng phải l&agrave; một sự đảm bảo từ Agoda rằng mọi chỗ ở đều kh&ocirc;ng c&oacute; rủi ro. Ch&uacute;ng t&ocirc;i dựa v&agrave;o c&aacute;c chỗ nghỉ để khẳng định c&aacute;c biện ph&aacute;p an to&agrave;n v&agrave; tiện nghi của ri&ecirc;ng họ. L&agrave; du kh&aacute;ch, tr&aacute;ch nhiệm của qu&yacute; kh&aacute;ch l&agrave; l&agrave;m theo lời khuy&ecirc;n của ch&iacute;nh phủ, thi h&agrave;nh những biện ph&aacute;p vệ sinh c&aacute; nh&acirc;n, v&agrave; &aacute;p dụng gi&atilde;n c&aacute;ch tiếp x&uacute;c v&agrave; vật l&yacute; trong thời gian qu&yacute; kh&aacute;ch ở lại đ&acirc;y. Agoda lu&ocirc;n lu&ocirc;n khuyến kh&iacute;ch đi lại an to&agrave;n v&agrave; cảnh gi&aacute;c với c&aacute;c điều kiện thay đổi.<\/p>\n<p>&nbsp;<\/p>\n<p>C&aacute;c biện ph&aacute;p an to&agrave;n v&agrave; vệ sinh hiện nay được bao gồm trong Th&ecirc;m Vệ Sinh l&agrave;:<\/p>\n<p>&nbsp;<\/p>\n<p><strong>C&aacute;c quy định an to&agrave;n<\/strong><\/p>\n<ul>\n<li>Khử tr&ugrave;ng th&ecirc;m to&agrave;n bộ khu c&ocirc;ng cộng v&agrave; tất cả c&aacute;c ph&ograve;ng d&agrave;nh cho kh&aacute;ch, ch&uacute; &yacute; đến khu vực thường bị chạm v&agrave;o như n&uacute;t bấm trong thang m&aacute;y, tay vịn, c&ocirc;ng tắc, v.v.<\/li>\n<li>Thu xếp đ&agrave;o tạo để đảm bảo nh&acirc;n vi&ecirc;n chỗ nghỉ thực hiện đồng bộ với c&aacute;c quy tr&igrave;nh an to&agrave;n v&agrave; vệ sinh.<\/li>\n<li>Kiểm tra th&acirc;n nhiệt hằng ng&agrave;y cho nh&acirc;n vi&ecirc;n v&agrave; kh&aacute;ch khi v&agrave;o t&ograve;a nh&agrave; hoặc cơ sở<\/li>\n<li>Cung cấp dịch vụ nhận ph&ograve;ng trực tuyến, tự động, hoặc tự phục vụ để hạn chế tiếp x&uacute;c với con người để tr&aacute;nh l&acirc;y nhiễm ch&eacute;o.<\/li>\n<li>Lắp đặt l&aacute; chắn bảo vệ trong suốt ở nơi c&ocirc;ng cộng giữa người nọ với người kia trong c&aacute;c giao dịch mặt đối mặt.<\/li>\n<\/ul>\n<p><strong>Thiết bị bảo hộ <\/strong><\/p>\n<ul>\n<li>Nước rửa tay được đặt trong tất cả c&aacute;c khu c&ocirc;ng cộng của chỗ nghỉ.<\/li>\n<li>Nh&acirc;n vi&ecirc;n chỗ nghỉ mang đồ che mặt/khẩu trang hoặc c&aacute;c thiết bị bảo hộ kh&aacute;c.<\/li>\n<li>Khử tr&ugrave;ng thiết bị để loại bỏ, ti&ecirc;u diệt, hoặc khử hoạt t&iacute;nh mọi vi khuẩn, virus, v.v.&nbsp;<\/li>\n<\/ul>\n<p><strong>Gi&atilde;n c&aacute;ch tiếp x&uacute;c <\/strong><\/p>\n<ul>\n<li>Gi&atilde;n c&aacute;ch vật l&yacute; &iacute;t nhất 1 m&eacute;t ở nơi c&ocirc;ng cộng.<\/li>\n<li>Bố tr&iacute; lại b&agrave;n v&agrave; chỗ ngồi trong khu vực ăn uống để đảm bảo gi&atilde;n c&aacute;ch tiếp x&uacute;c.<\/li>\n<\/ul>\n<p><strong>Sức khỏe v&agrave; y tế<\/strong><\/p>\n<ul>\n<li>C&oacute; trang thiết bị d&ugrave;ng để điều trị y học tại chỗ nghỉ.<\/li>\n<\/ul>\n<p>&nbsp;<\/p>\n<p><strong>Điều khoản v&agrave; tuy&ecirc;n bố miễn trừ tr&aacute;ch nhiệm<\/strong><\/p>\n<ul>\n<li>Khi qu&yacute; kh&aacute;ch đặt ph&ograve;ng với kh&aacute;ch sạn hoặc chỗ ở (&ldquo;Chỗ nghỉ&rdquo;) c&oacute; nh&atilde;n hiệu hiển thị ngoại vi hoặc c&aacute;c biện ph&aacute;p Th&ecirc;m Vệ Sinh (&ldquo;Th&ecirc;m Vệ Sinh&rdquo;), ch&uacute;ng t&ocirc;i muốn n&oacute;i r&otilde; l&agrave; Chỗ nghỉ đ&atilde; tự chứng nhận rằng họ c&oacute; c&aacute;c cơ sở vật chất v&agrave; biện ph&aacute;p tại Chỗ nghỉ. Như vậy, một m&igrave;nh Chỗ nghỉ x&aacute;c nhận rằng họ c&oacute; c&aacute;c cơ sở vật chất (v&agrave;/hoặc c&aacute;c chứng nhận &aacute;p dụng) v&agrave; họ đang thực hiện c&aacute;c biện ph&aacute;p Th&ecirc;m Vệ Sinh được liệt k&ecirc; li&ecirc;n quan đến độ sạch sẽ, an to&agrave;n v&agrave; vệ sinh tại thời điểm qu&yacute; kh&aacute;ch đặt ph&ograve;ng.<\/li>\n<\/ul>\n<ul>\n<li>Thỉnh thoảng Chỗ nghỉ c&oacute; thể cập nhật c&aacute;c biện ph&aacute;p Th&ecirc;m Vệ Sinh được x&aacute;c định l&agrave; c&oacute; sẵn v&agrave; c&oacute; thể chọn kh&ocirc;ng tham gia chương tr&igrave;nh Th&ecirc;m Vệ Sinh n&agrave;y nếu họ kh&ocirc;ng c&ograve;n duy tr&igrave; đầy đủ hoặc một phần c&aacute;c cơ sở vật chất v&agrave;/hoặc biện ph&aacute;p như vậy. Trước khi nhận ph&ograve;ng, qu&yacute; kh&aacute;ch n&ecirc;n kiểm tra lại t&igrave;nh trạng của c&aacute;c biện ph&aacute;p được cung cấp tại Chỗ nghỉ v&igrave; c&aacute;c biện ph&aacute;p n&agrave;y c&oacute; thể thỉnh thoảng thay đổi.<\/li>\n<\/ul>\n<ul>\n<li>Nếu qu&yacute; kh&aacute;ch gặp bất kỳ vấn đề n&agrave;o sau khi đ&atilde; nhận ph&ograve;ng th&igrave; qu&yacute; kh&aacute;ch n&ecirc;n li&ecirc;n hệ trực tiếp với Chỗ nghỉ.<\/li>\n<\/ul>\n<ul>\n<li>Xin lưu &yacute;, qu&yacute; kh&aacute;ch c&oacute; thể bị từ chối nhận ph&ograve;ng tại Chỗ nghỉ do th&acirc;n nhiệt cao hoặc bệnh truyền nhiễm.<\/li>\n<\/ul>\n<ul>\n<li>Agoda muốn l&agrave;m s&aacute;ng tỏ rằng c&aacute;c dịch vụ lưu tr&uacute; bao gồm c&aacute;c biện ph&aacute;p Th&ecirc;m Vệ Sinh do Chỗ nghỉ cung cấp th&ocirc;ng qua nền tảng Agoda sẽ l&agrave; tr&aacute;ch nhiệm ph&aacute;p l&yacute; v&agrave; tr&aacute;ch nhiệm của ri&ecirc;ng Chỗ nghỉ.<\/li>\n<\/ul>\n<ul>\n<li>Trừ phi c&oacute; chỉ định kh&aacute;c ở đ&acirc;y, tất cả c&aacute;c điều khoản kh&aacute;c của Điều khoản Sử dụng v&agrave; Ch&iacute;nh s&aacute;ch Quyền ri&ecirc;ng tư của Agoda vẫn được &aacute;p dụng.<\/li>\n<\/ul>\n<p>&nbsp;<\/p>\n<\/div>',wellness:"Sức khỏe",wellnessTabDescription:"Mọi thứ quý khách cần để có một kỳ nghỉ dưỡng trẻ hóa cho cả cơ thể và tinh thần.",seeAllAmenities:"Xem mọi tiện nghi",staycationWellness:"Sức khỏe",drinkingAndDining:"Ăn và Uống",activities:"Hoạt động",sportsAndEntertainment:"Thể thao và Giải trí",staycationOffersAvailable:"Đang có khuyến mại kỳ nghỉ ngắn",staycationDescription:"Tận hưởng các lợi ích đặc biệt trong thời gian lưu trú",travelAdvisorPropertyBannerTravellingCountry:"Sắp đi du lịch tới {0}?",travelAdvisorPropertyBannerText:"{0} Hãy đọc tất cả các yêu cầu cập nhật trước khi quý khách đặt chỗ.",travelAdvisorPropertyBannerLink:"Tìm hiểu thêm",travelAdvisorPropertyBannerDomesticText:"Đi từ nước ngoài đến {0} ư? ",travelAdvisorPropertyBannerRestrictionsModalEntryRequirementTitle:"{ hỉ (gọi chung là <b>“tiện nghi”<\/b>) – bao gồm nhưng không giới hạn ở các tiện nghi liên quan đến độ sạch sẽ và vệ sinh – là thông tin do chỗ nghỉ <u>tự tuyên bố<\/u>. Quý khách thừa nhận rằng Agoda <u>không<\/u> xác minh hay chứng nhận bất kỳ bản tự tuyên bố nào như vậy và một mình chỗ nghỉ đang trình bày cho quý khách rằng, tại thời điểm đặt phòng, họ đã có các tiện nghi được hiển thị.\n\t\t<\/li>\n\t\t<li>\n\t\t\t\tQuý khách thừa nhận rằng mác Thêm Vệ Sinh hay bất kỳ thông tin liên quan nào đến tiện nghi được hiển thị trên Agoda đều không phải là sự đảm bảo từ Agoda rằng chỗ ở không có rủi ro hay rủi ro đó đã được kiểm soát ở một mức độ nhất định.\n\t\t<\/li>\n\t\t<li>\n\t\t\t\tThỉnh thoảng, chỗ nghỉ có thể thay đổi bản tự tuyên bố của mình về những tiện nghi mà chỗ nghỉ có, và có thể chọn loại bỏ mác Thêm Vệ Sinh. Trước khi nhận phòng, quý khách nên liên hệ trực tiếp với chỗ nghỉ để xác nhận tình trạng của bất kỳ tiện nghi nào tại chỗ nghỉ, vì khả năng cung cấp hoặc triển khai các tiện nghi có thể thỉnh thoảng thay đổi.\n\t\t<\/li>\n\t\t<li>\n\t\t\t\tNếu quý khách gặp bất kỳ vấn đề nào sau khi nhận phòng thì quý khách nên chuyển tải trực tiếp bất kỳ mối quan tâm nào với chỗ nghỉ.\n\t\t<\/li>\n\t\t<li>\n\t\t\t\tQuý khách thừa nhận rằng nếu quý khách biểu hiện bất kỳ dấu hiệu nào về thân nhiệt cao hoặc bệnh truyền nhiễm thì chỗ nghỉ có thể ngăn cản quý khách nhận phòng.\n\t\t<\/li>\n\t\t<li>\n\t\t\t\tQUÝ KHÁCH THỪA NHẬN VÀ ĐỒNG Ý RẰNG RIÊNG CHỖ NGHỈ VÀ CHỦ VÀ BAN QUẢN LÝ CHỖ NGHỈ SẼ CÓ TRÁCH NHIỆM PHÁP LÝ VÀ TRÁCH NHIỆM VỚI QUÝ KHÁCH VỀ MÁC THÊM VỆ SINH, BẤT KỲ DỊCH VỤ NÀO ĐƯỢC CUNG CẤP TẠI CHỖ NGHỈ, HOẶC BẤT KỲ BẢN TUYÊN BỐ HOẶC TRÌNH BÀY NÀO LIÊN QUAN THÊM VÀO ĐÓ. AGODA SẼ KHÔNG CÓ TRÁCH NHIỆM PHÁP LÝ HAY TRÁCH NHIỆM VỚI QUÝ KHÁCH HAY BẤT KỲ BÊN THỨ BA NÀO VỀ MÁC THÊM VỆ SINH, BẤT KỲ DỊCH VỤ NÀO ĐƯỢC CUNG CẤP TẠI CHỖ NGHỈ, HOẶC BẤT KỲ BẢN TUYÊN BỐ HOẶC TRÌNH BÀY NÀO LIÊN QUAN THÊM VÀO ĐÓ.\n\t\t<\/li>\n\t\t<li>\n\t\t\t\tTrừ phi có chỉ định khác ở đây hoặc được Agoda thông báo, Điều khoản Sử dụng và Chính sách Quyền riêng tư của Agoda vẫn áp dụng cho quý khách. Trong trường hợp có bất kỳ sự mơ hồ nào trong các điều khoản này, sẽ áp dụng theo cách giải thích hợp lý của Agoda. Thỉnh thoảng Agoda có thể sửa đổi các điều khoản này, và bằng cách sử dụng nền tảng đặt phòng của Agoda, quý khách chấp nhận bất kỳ việc sửa đổi nào như vậy.\n\t\t<\/li>\n\t\t<li>\n\t\t\t\tQuý khách sẽ trình bất kỳ tranh chấp nào liên quan đến các điều khoản này, bất kỳ tiện nghi nào, hoặc mác Thêm Vệ Sinh lên thẩm quyền chuyên thuộc của các tòa án có thẩm quyền ở Singapore, nếu (các) tranh chấp như vậy không thể được giải quyết nhẹ nhàng.\n\t\t<\/li>\n\t\t<li>\n\t\t\t\tNếu bất cứ phần nào của các điều khoản này được phát hiện là không hợp lệ hoặc không thể thi hành được thì phát hiện như vậy sẽ không ảnh hưởng bất lợi đến phần còn lại của các điều khoản này sẽ không bị ảnh hưởng bất lợi, và phần không hợp lệ hoặc không thể thi hành được sẽ được thay thế bằng một điều khoản mới, hợp lệ và có thể thi hành được, có hiệu lực tương tự ở mức tối đa có thể.\n\t\t<\/li>\n\t<\/ul>\n<\/div>',priceBeforeApplyingCoupon:"Giá trước khi áp dụng phiếu giảm giá",priceAfterApplyingCoupon:"Giá sau khi áp dụng phiếu giảm giá",matchScoreExcellentBreakfast:"Bữa sáng trên cả tuyệt vời",matchScoreGreatBreakfast:"Bữa sáng tuyệt vời",matchScoreGoodBreakfast:"Bữa sáng ngon",matchScoreExcellentLocation:"Vị trí trên cả tuyệt vời",matchScoreGreatLocation:"Vị trí tuyệt vời",matchScoreGoodLocation:"Vị trí thuận lợi",matchScoreExcellentStaff:"Nhân viên trên cả tuyệt vời",matchScoreGreatStaff:"Nhân viên tuyệt vời",matchScoreGoodStaff:"Nhân viên tốt",matchScoreVerySpacious:"Rất rộng rãi",matchScoreVeryClean:"Rất sạch sẽ",matchScoreTooltipMain:"{0} à, chúng tôi nghĩ chỗ này {1}",matchScoreGreatForYou:"rất phù hợp với quý khách",matchScoreTooltipDescription:"Dựa trên các chỗ nghỉ quý khách đã xem gần đây và các đơn đặt phòng trước đây.",matchScoreIsThisHelpful:"Điều này có giúp ích gì khô
